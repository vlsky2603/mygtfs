<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Winnipeg Transit Vision</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f0f2f5">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0a">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/styles.mobile2025.css">
</head>
<body>
    <div id="top-progress-bar"></div>
    <div id="map"></div>
    <div id="loading">
        <div class="loading-animation-container">
            <div class="loading-spinner"></div>
        </div>
        <span class="loading-text">Loading transit data...</span>
    </div>

    <div class="ios-map-overlay" aria-live="polite">
        <div class="ios-top-stack">
            <div class="ios-search-card" role="search">
                <div class="ios-search-header">
                    <label class="ios-from-label">
                        <span>From</span>
                        <strong id="ios-start-label">Your location</strong>
                    </label>
                    <button type="button" id="ios-search-collapse" class="ios-search-collapse" aria-expanded="true" aria-label="Collapse search panel">
                        <i class="fas fa-chevron-up"></i>
                    </button>
                </div>
                <div class="ios-search-input-row autocomplete-wrapper">
                    <i class="fas fa-magnifying-glass"></i>
                    <input id="ios-destination-input" type="text" placeholder="Enter destination" autocomplete="off" aria-label="Destination">
                    <button type="button" id="ios-clear-destination" aria-label="Clear destination">&times;</button>
                    <div id="ios-destination-suggestions" class="autocomplete-dropdown"></div>
                </div>
                <div class="ios-search-actions">
                    <button type="button" id="ios-go-button" class="ios-primary-btn">Go</button>
                </div>
            </div>
            <div class="ios-chips-row">
                <button class="ios-quick-chip" type="button" id="ios-locate-button" title="Center on my location">
                    <i class="fas fa-location-crosshairs"></i>
                    <span>Locate</span>
                </button>
                <button class="ios-quick-chip" type="button" id="ios-layers-button" title="Filters">
                    <i class="fas fa-layer-group"></i>
                    <span>Layers</span>
                </button>
                <button class="ios-quick-chip hidden" type="button" id="ios-clear-filter-button" title="Clear Route">
                    <i class="fas fa-times-circle"></i>
                    <span>Clear</span>
                </button>
                <button class="ios-quick-chip" type="button" id="ios-theme-button" title="Toggle theme">
                    <i class="fas fa-moon"></i>
                </button>
            </div>
        </div>

        <div id="ios-results-sheet" class="ios-results-sheet hidden" aria-live="polite">
            <div class="ios-results-header">
                <div class="ios-results-title">
                    <span class="ios-results-label">Routes</span>
                    <span class="ios-results-subtitle" id="ios-results-status">Select a route</span>
                </div>
                <div class="ios-results-actions">
                    <button type="button" id="ios-results-close" class="ios-icon-button" aria-label="Close routes">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            </div>
            <div class="ios-results-scroll">
                <div id="ios-quick-results" class="ios-quick-results empty" data-placeholder="Enter a destination to see routes"></div>
            </div>
        </div>

        <div class="ios-bottom-stack">
            <button id="ios-mini-stop-card" type="button" class="ios-mini-card hidden" aria-live="polite" title="View arrivals">
                <div class="mini-top-row">
                    <div>
                        <div class="mini-label">Selected stop</div>
                        <div class="mini-stop-name">Tap any stop</div>
                    </div>
                    <div class="mini-time">—</div>
                </div>
                <div class="mini-subline">Live arrivals will appear here</div>
            </button>

            <div id="ios-bottom-dock" class="ios-bottom-dock" role="group" aria-label="Primary actions">
                <button class="ios-dock-button" type="button" data-panel-target="favorites-panel">
                    <i class="fas fa-star"></i>
                    <span>Saved</span>
                </button>
                <button class="ios-dock-button" type="button" data-panel-target="schedule-panel">
                    <i class="fas fa-clock"></i>
                    <span>Arrivals</span>
                </button>
                <button class="ios-dock-button" type="button" data-panel-target="regular-notifications-panel">
                    <i class="fas fa-bell"></i>
                    <span>Alerts</span>
                </button>
                <button class="ios-dock-button" type="button" data-panel-target="filter-panel">
                    <i class="fas fa-sliders"></i>
                    <span>Filter</span>
                </button>
            </div>
        </div>
    </div>
    
    <div id="command-center" class="command-center">
        <div class="command-center__badge">
            <span class="badge-dot"></span>
            <span>Transit Studio</span>
        </div>
        <div class="command-grid">
            <button id="filter-toggle" class="command-card" title="Filters">
                <i class="fas fa-filter"></i>
                <div class="command-card__body">
                    <p>Filters</p>
                    <span>Routes & streets</span>
                </div>
            </button>
            <button id="favorites-toggle" class="command-card" title="Favorite Stops">
                <i class="fas fa-star"></i>
                <div class="command-card__body">
                    <p>Favorites</p>
                    <span>Quick access</span>
                </div>
            </button>
            <button id="regular-notifications-toggle-button" class="command-card" title="My Reminders">
                <i class="fas fa-bell"></i>
                <div class="command-card__body">
                    <p>Reminders</p>
                    <span>Arrive on time</span>
                </div>
            </button>
            <button id="theme-toggle" class="command-card" title="Toggle Theme">
                <i class="fas fa-moon"></i>
                <div class="command-card__body">
                    <p>Theme</p>
                    <span>Light / Dark</span>
                </div>
            </button>
        </div>
        <div class="command-mini-row">
            <button id="location-button" class="command-chip" title="My Location">
                <i class="fas fa-location-arrow"></i>
                <span>Locate me</span>
            </button>
            <button id="reset-route-button" class="command-chip command-chip--alert" title="Clear selected route">
                <i class="fas fa-eraser"></i>
                <span>Clear route</span>
            </button>
        </div>
    </div>
    
    <div id="filter-panel" class="panel">
        <div class="panel-handle"></div>
        <div class="panel-header">
            <h3>Filters</h3>
            <div class="panel-actions">
                <button id="reset-filters" class="control-button">Reset</button>
                <button id="close-filters" class="control-button"><i class="fas fa-times"></i></button>
            </div>
        </div>
        <div class="panel-content">
            <div class="filter-group">
                <label for="route-filter">Route (GTFS):</label>
                <select id="route-filter">
                    <option value="">All Routes</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Direction</label>
                <select id="direction-filter">
                    <option value="">All Directions</option>
                    <option value="Northbound">Northbound</option>
                    <option value="Southbound">Southbound</option>
                    <option value="Eastbound">Eastbound</option>
                    <option value="Westbound">Westbound</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Street</label>
                <div class="search-container">
                    <input type="text" id="street-search" placeholder="Search streets...">
                    <select id="street-filter">
                        <option value="">All Streets</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <div id="favorites-panel" class="panel">
        <div class="panel-handle"></div>
        <div class="panel-header">
            <h3>Favorite Stops</h3>
            <button id="close-favorites-panel" class="control-button"><i class="fas fa-times"></i></button>
        </div>
        <div class="panel-content">
            <div class="favorites-list-container"></div>
        </div>
    </div>
    
    <div id="schedule-panel" class="panel">
        <div class="panel-handle"></div>
        <div class="panel-header">
            <h3 id="schedule-panel-title">Schedule</h3>
            <div class="header-actions-wrapper"></div>
        </div>
        <div class="panel-content">
            <div class="schedule-content"></div>
        </div>
    </div>

    <div id="regular-notifications-panel" class="panel">
        <div class="panel-handle"></div>
        <div class="panel-header">
            <h3 id="regular-notifications-panel-title">My Reminders</h3>
            <div class="header-actions-wrapper">
                <button id="add-new-regular-notification-rule" class="control-button" title="Add New Reminder Rule"><i class="fas fa-plus"></i></button>
                <button id="close-regular-notifications-panel" class="control-button" title="Close Reminders"><i class="fas fa-times"></i></button>
            </div>
        </div>
        <div class="panel-content">
            <div class="regular-notifications-list-container"></div>
        </div>
    </div>

    <div id="rule-editor-modal" class="modal-hidden">
// ...existing code...

    </div>

    <div id="rule-editor-modal" class="modal-hidden">
        <div class="modal-content">
            <h4 id="rule-editor-title">Set Up Reminder</h4>
            <input type="hidden" id="rule-editor-mode" value="add">
            <input type="hidden" id="rule-editor-rule-id" value="">
            <label for="rule-stop-select">Stop:</label>
            <select id="rule-stop-select" class="rule-editor-input"></select>
            <small>Select a stop to see available routes.</small>
            <label for="rule-route-select">Route:</label>
            <select id="rule-route-select" class="rule-editor-input" disabled></select>
            <label>Notify between:</label>
            <div style="display: flex; gap: 10px; align-items: center;">
                <input type="time" id="rule-time-start" class="rule-editor-input" value="08:00">
                <span>and</span>
                <input type="time" id="rule-time-end" class="rule-editor-input" value="09:00">
            </div>
            <label>On days:</label>
            <div id="rule-days-select" class="rule-editor-days">
                <input type="checkbox" id="day-mon" value="1"><label for="day-mon">Mon</label>
                <input type="checkbox" id="day-tue" value="2"><label for="day-tue">Tue</label>
                <input type="checkbox" id="day-wed" value="3"><label for="day-wed">Wed</label>
                <input type="checkbox" id="day-thu" value="4"><label for="day-thu">Thu</label>
                <input type="checkbox" id="day-fri" value="5"><label for="day-fri">Fri</label>
                <input type="checkbox" id="day-sat" value="6"><label for="day-sat">Sat</label>
                <input type="checkbox" id="day-sun" value="0"><label for="day-sun">Sun</label>
            </div>
            <label for="rule-notify-minutes">Notify me</label>
            <div style="display: flex; gap: 5px; align-items: center;">
                <input type="number" id="rule-notify-minutes" class="rule-editor-input" value="5" min="1" max="60" style="width: 70px;">
                <span>minutes before arrival.</span>
            </div>
            <div class="rule-editor-actions">
                <button id="save-rule-button" class="control-button primary">Save Rule</button>
                <button id="cancel-rule-button" class="control-button">Cancel</button>
            </div>
        </div>
    </div>
    
    <div id="radius-label">400 m</div>
    <div id="toast-notifications"></div>
    
    <!-- Внешние библиотеки -->
    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    
    <!-- Наши новые модули (порядок важен!) -->
    <script src="/js/utils.js"></script>
    <script src="/js/smart_cache.js"></script>
    <script src="/js/schedule_enhancer.js"></script>
    <script src="/js/favorites_manager.js"></script>
    <script src="/js/notifications_manager.js"></script>
    <script src="/js/ui_controller.js"></script>
    <script src="/js/api_data_loader.js"></script>
    <script src="/js/gtfs_handler.js"></script>
    <script src="/js/map_drawer.js"></script>
    <script src="/js/bus_simulator.js"></script>
    
    <!-- Главный файл-координатор (загружается последним) -->
    <script src="/main_dynamic.js"></script>
</body>
</html>
